name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    # No container service. `npm run verify` owns one pinned native PostgreSQL
    # cluster for the whole sequential run (FID-2026-1105-002).
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: node scripts/attribution-guard.mjs
      - run: npm run verify
