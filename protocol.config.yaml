# Protocol Config — project-specific configuration for ECHO Protocol
#
# Governance for this repository is the single-agent contract at
# `dev/echo-v0.1.2-single-agent.md`, reached through `ECHO-single-agent.md`.
# `ECHO.md` is the canonical harness reference; it is read-only context here and
# is NOT the governing contract for a single-agent session.
#
# The commands below are the gates this repository actually runs. There is no
# `fid:verify` binary: FID closure is checked by review against
# `templates/FID-TEMPLATE.md` and the commit recorded in the FID.

project:
  name: 'savant-gateway'
  description: 'A Next.js gateway for the full provider catalog, with hashed consumer keys, sell-price math, credit settlement, streaming, and revenue analytics.'
  version: '0.1.0'

protocol:
  version: '0.2.0'
  strict_mode: true # true = all 15 laws active (default), false = core 4 laws only

single_agent:
  protocol:
    file: 'dev/echo-v0.1.2-single-agent.md'
    version: '0.1.2-single-agent'
    strict_mode: true

language: 'typescript'

commands:
  build: 'npm run build'
  test: 'npm test'
  # Route-level HTTP gate. Requires a completed production build and boots
  # `next start` against a disposable database; it is not part of `npm test`.
  test_http: 'npm run test:http'
  # Backup/restore drill. Requires a completed production build; it boots real
  # servers on throwaway databases and proves recovery through HTTP reconciliation.
  test_recovery: 'npm run test:recovery'
  type_check: 'npm run typecheck'
  config_check: 'npm run config:check'
  config_check_prod: 'npm run config:check:prod'
  lint: 'npm run lint'
  quality: 'npm run quality'
  verify: 'npm run verify'
  dev: 'npm run dev'

paths:
  src: null
  tests: 'tests/'
  docs: 'docs/'
  dev: 'dev/'
  fids: 'dev/fids/'
  fids_archive: 'dev/fids/archive/'
  session_summaries: 'dev/session-summaries/'
  learnings: 'dev/LEARNINGS.md'
  scope: 'SCOPE.md'
  changelog: 'CHANGELOG.md'
  coding_standards: 'coding-standards/'

# The file-length ceiling is enforced by scripts/quality-report.mjs over the
# directories below. The other values are review criteria, not machine gates.
quality:
  max_file_lines: 400
  max_function_lines: 50
  max_line_length: 100
  max_complexity: 10
  max_params: 4
  max_comment_density: 0.33
  max_nesting_depth: 3
  enforced: true
  scan:
    - 'app'
    - 'components'
    - 'config'
    - 'lib'

testing:
  fuzz_enabled: false
  mutation_enabled: false
  coverage_threshold: 80
  test_timeout: 30
  parallel_tests: true

fid:
  auto_create: true
  severity_levels: ['critical', 'high', 'medium', 'low']
  max_open_fids: 20

perfection_loop:
  max_iterations: 10
  change_threshold: 0.10
  convergence_threshold: 0.02
  convergence_passes: 2
  oscillation_limit: 3

session:
  auto_summary: true
  summary_interval: 30
  max_session_hours: 4
  autonomy_level: 3

# No coding agent may be credited in this repository. The rule is enforced by
# scripts/attribution-guard.mjs from the commit-msg hook, the pre-push hook and
# the attribution-guard CI workflow.
attribution:
  policy: 'no-agent-credit'
  enforced_by:
    - '.githooks/commit-msg'
    - '.githooks/pre-push'
    - '.github/workflows/attribution-guard.yml'
