name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: node scripts/attribution-guard.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run quality
      - run: npm run build
      - run: npm run test:http
      - run: npm run test:recovery
