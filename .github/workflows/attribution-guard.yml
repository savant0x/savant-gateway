name: attribution-guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-agent-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: node scripts/attribution-guard.mjs --all
      - run: node scripts/attribution-document-guard.mjs
      - run: node --test tests/attribution-guard.test.mjs
