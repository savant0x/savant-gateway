<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; font-src data:; connect-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
<title>Fruit slicing game</title>
<style>
html,body{height:100%;margin:0;background:#071018;color:#dbe9ef;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:12px;top:12px;font:13px ui-sans-serif,system-ui,sans-serif}
</style>
</head>
<body>
<canvas id="game" aria-label="Fruit slicing game"></canvas>
<div id="hud">Score: 0</div>
<script>
const canvas = document.getElementById("game");
const hud = document.getElementById("hud");
const ctx = canvas.getContext("2d");
let score = 0;
let frames = 0;
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
function draw() {
  frames += 1;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#0b2030";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#ffab33";
  ctx.beginPath();
  ctx.arc(canvas.width / 2, canvas.height / 2, 48, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#dbe9ef";
  ctx.font = "14px ui-sans-serif";
  ctx.fillText("frame " + frames, 12, 28);
  requestAnimationFrame(draw);
}
canvas.addEventListener("pointerdown", () => {
  score += 1;
  hud.textContent = "Score: " + score;
});
window.addEventListener("resize", resize);
resize();
draw();
</script>
</body>
</html>
