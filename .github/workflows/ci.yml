name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway_concurrency_probe
          POSTGRES_DB: gateway_concurrency
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: node scripts/attribution-guard.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run config:check
      - run: npm test
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://gateway:gateway_concurrency_probe@127.0.0.1:5432/gateway_concurrency
      - run: npm run quality
      - run: npm run build
      - run: npm run test:http
      - run: npm run test:recovery
