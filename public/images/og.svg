<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Savant Gateway — an independent inference gateway">
  <!-- Social preview source. `npm run images` rasterises this to og.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="0.55" stop-color="#080b11"/>
      <stop offset="1" stop-color="#041014"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00fbff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00fbff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#00fbff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#00fbff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#00fbff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g opacity="0.9">
    <circle cx="915" cy="315" r="7" fill="#00fbff"/>
    <circle cx="1030" cy="220" r="4.5" fill="#00fbff" opacity="0.75"/>
    <circle cx="1055" cy="410" r="4" fill="#00fbff" opacity="0.6"/>
    <circle cx="1120" cy="300" r="3" fill="#00fbff" opacity="0.5"/>
    <circle cx="1105" cy="162" r="2.5" fill="#00fbff" opacity="0.4"/>
    <circle cx="1090" cy="470" r="2.5" fill="#00fbff" opacity="0.4"/>
    <path d="M922 311 L1024 224" stroke="url(#fade)" stroke-width="1.3" fill="none"/>
    <path d="M923 320 L1049 406" stroke="url(#fade)" stroke-width="1.3" fill="none"/>
    <path d="M1114 300 L1105 164" stroke="#00fbff" stroke-opacity="0.25" stroke-width="1" fill="none"/>
    <path d="M1114 300 L1092 468" stroke="#00fbff" stroke-opacity="0.25" stroke-width="1" fill="none"/>
    <path d="M1030 224 L1120 296" stroke="#00fbff" stroke-opacity="0.2" stroke-width="1" fill="none"/>
    <path d="M1055 406 L1120 304" stroke="#00fbff" stroke-opacity="0.2" stroke-width="1" fill="none"/>
  </g>

  <text x="80" y="196" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="16" letter-spacing="7" fill="#00fbff" fill-opacity="0.78">INDEPENDENT INFERENCE GATEWAY</text>

  <text x="78" y="300" font-family="'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="-1.5" fill="#f7fbfc">SAVANT <tspan fill="#00fbff">GATEWAY</tspan></text>

  <text x="82" y="356" font-family="'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="30" fill="#9fb3bb">Frontier models. Grounded prices.</text>

  <rect x="80" y="410" width="1040" height="1" fill="#00fbff" fill-opacity="0.18"/>

  <text x="82" y="458" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="17" letter-spacing="1" fill="#7f97a1">ONE OPENAI-COMPATIBLE API</text>
  <text x="82" y="492" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="17" letter-spacing="1" fill="#7f97a1">PREPAID CREDIT · ACCOUNT-OWNED KEYS</text>
  <text x="82" y="526" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="17" letter-spacing="1" fill="#7f97a1">UPSTREAM COST, SELL PRICE AND REVENUE KEPT APART</text>

  <rect x="80" y="560" width="1040" height="1" fill="#00fbff" fill-opacity="0.18"/>
</svg>
