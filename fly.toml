# Savant Gateway — exactly one machine, one process, one SQLite file.
#
# The storage contract in docs/deployment-runbook.md is the reason for every
# setting here. Do not add a second machine, a process manager, or
# scale-to-zero: a second writer against this volume corrupts the ledger, and
# the app's startup gate refuses a multi-process topology anyway.

app = "savant-gateway"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"
  # This value must match [env] below. The build arg resolves social image URLs
  # in static pages; the runtime value feeds redirects and the sitemap/robots.
  [build.args]
    NEXT_PUBLIC_SITE_URL = "https://savant-gateway.fly.dev"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # Absolute and off the system temp directory: the startup gate rejects
  # anything else in a production start.
  DB_PATH = "/data/gateway.db"
  # Must be the real https origin. Replace after the app name is final, and
  # never point this at the .fly.dev host while a custom domain is canonical.
  NEXT_PUBLIC_SITE_URL = "https://savant-gateway.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  # One machine, always running. There is no replica to stop or start, and the
  # gateway settles billing on stream close, which a suspended machine cannot do.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    # Readiness, not liveness. /api/ready returns 503 unless the origin is
    # https, DB_PATH is usable, admin credentials are configured and the volume
    # accepts a write, so a misconfigured deploy never enters rotation.
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/ready"

[[mounts]]
  source = "gateway_data"
  destination = "/data"

[deploy]
  # Drain in-flight streams before the process is replaced. The runbook asks for
  # a grace period longer than the slowest streamed completion.
  kill_signal = "SIGTERM"
  kill_timeout = "120s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
