name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://gateway:gateway_concurrency_probe@127.0.0.1:5432/gateway_concurrency
      # The trial suite's concurrent transactions need real PostgreSQL
      # semantics; PGlite's single connection interleaves them. The gate
      # resets both schemas, so it must follow the concurrency proof.
      HTTP_TEST_DATABASE_URL: postgres://gateway:gateway_concurrency_probe@127.0.0.1:5432/gateway_concurrency
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway_concurrency_probe
          POSTGRES_DB: gateway_concurrency
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: node scripts/attribution-guard.mjs
      - run: npm run verify
